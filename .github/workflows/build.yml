name: Extraer Motor FilzaSlop (.dylib)
on: [push, workflow_dispatch]

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive # CRÍTICO: Necesario para XPF, kexploit, etc.

      - name: 🛠️ Instalar Theos y dependencias
        run: |
          # 1. Instalar herramientas necesarias
          brew install ldid dpkg make
          
          # 2. Añadir el 'make' moderno de Homebrew al PATH (soluciona el aviso de gmake)
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH
          
          # 3. Clonar Theos en la carpeta del usuario (evita el error de permisos de /opt)
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 4. Configurar variables de entorno para que el sistema encuentre Theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: ⚙️ Compilar el proyecto
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: 🔍 Buscar y aislar el .dylib
        run: |
          # Theos guarda los compilados en la carpeta .theos/obj/
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;
          
          # Mostrar qué se encontró para verificar en los logs de GitHub
          echo "Archivos .dylib encontrados:"
          ls -la output/

      - name: 📤 Subir el .dylib a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Motor-FilzaSlop-dylib
          path: output/*.dylib
